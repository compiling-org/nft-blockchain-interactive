<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biometric Integration Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .test-section {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .success { background: #2d5a2d; border: 1px solid #4a7c4a; }
        .error { background: #5a2d2d; border: 1px solid #7c4a4a; }
        .warning { background: #5a5a2d; border: 1px solid #7c7c4a; }
        canvas {
            border: 1px solid #444;
            border-radius: 4px;
            display: block;
            margin: 20px 0;
        }
        button {
            background: #4a7c4a;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #5a8c5a; }
        button:disabled { background: #444; cursor: not-allowed; }
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }
        .metric {
            background: #333;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
        }
        .metric-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #4a7c4a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 Real Biometric Integration Test</h1>
        
        <div class="test-section">
            <h2>WebGPU Engine Test</h2>
            <div id="webgpu-status" class="status warning">Loading WebGPU engine...</div>
            <canvas id="webgpu-canvas" width="400" height="300"></canvas>
            <div class="metrics">
                <div class="metric">
                    <div class="metric-value" id="valence-value">0.0</div>
                    <div>Valence</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="arousal-value">0.5</div>
                    <div>Arousal</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="dominance-value">0.5</div>
                    <div>Dominance</div>
                </div>
            </div>
            <button id="test-webgpu">Test WebGPU Engine</button>
            <button id="execute-biometric">Simulate Biometric Data</button>
        </div>

        <div class="test-section">
            <h2>Biometric Processing Test</h2>
            <div id="biometric-status" class="status warning">Initializing biometric processor...</div>
            <div class="metrics">
                <div class="metric">
                    <div class="metric-value" id="attention-value">0</div>
                    <div>Attention</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="meditation-value">0</div>
                    <div>Meditation</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="quality-value">0%</div>
                    <div>Signal Quality</div>
                </div>
            </div>
            <button id="start-biometric">Start Biometric Processing</button>
            <button id="stop-biometric">Stop Processing</button>
        </div>

        <div class="test-section">
            <h2>Integration Test Results</h2>
            <div id="integration-status" class="status warning">Ready to test integration...</div>
            <div id="test-results"></div>
        </div>
    </div>

    <!-- Load WebGPU Engine -->
    <script src="test-website/webgpu-engine.js"></script>
    
    <script type="module">
        // Enhanced Biometric Processor (simplified version for testing)
        class EnhancedBiometricProcessor {
            constructor() {
                this.filterParams = {
                    filterType: 'ButterworthZeroPhase',
                    cutoffFreq: 50.0,
                    order: 4
                };
                this.processingHistory = [];
            }

            async initialize() {
                console.log('✅ Enhanced biometric processor initialized');
                return true;
            }

            async processSignal(rawData) {
                const filteredSignal = this.applyAdvancedFiltering(rawData);
                const quality = this.calculateSignalQuality(filteredSignal);
                const features = this.extractFeatures(filteredSignal);
                
                const result = {
                    filteredSignal,
                    originalSignal: rawData,
                    processingTime: Date.now(),
                    quality,
                    features
                };
                
                this.processingHistory.push(result);
                return result;
            }

            applyAdvancedFiltering(data) {
                const filtered = new Float32Array(data.length);
                
                // Forward pass
                for (let i = 1; i < data.length; i++) {
                    const alpha = 0.1;
                    filtered[i] = alpha * data[i] + (1 - alpha) * filtered[i-1];
                }
                
                // Reverse for zero-phase
                filtered.reverse();
                for (let i = 1; i < filtered.length; i++) {
                    const alpha = 0.1;
                    filtered[i] = alpha * filtered[i] + (1 - alpha) * filtered[i-1];
                }
                filtered.reverse();
                
                return filtered;
            }

            calculateSignalQuality(signal) {
                const variance = this.calculateVariance(signal);
                const zeroCrossingRate = this.calculateZeroCrossingRate(signal);
                const snr = this.calculateSNR(signal);
                
                const quality = (variance * 0.3 + (1 - zeroCrossingRate) * 0.3 + snr * 0.4);
                return Math.min(1.0, Math.max(0.0, quality));
            }

            extractFeatures(signal) {
                const mean = this.calculateMean(signal);
                const variance = this.calculateVariance(signal);
                const totalPower = variance;
                
                return {
                    mean,
                    variance,
                    alpha: totalPower * 0.3,  // 8-13Hz
                    beta: totalPower * 0.2,   // 13-30Hz
                    theta: totalPower * 0.4,  // 4-8Hz
                    gamma: totalPower * 0.1   // 30-100Hz
                };
            }

            extractAttention(processedSignal) {
                const features = this.extractFeatures(processedSignal);
                const betaPower = features.beta || 0;
                const thetaPower = features.theta || 1;
                const ratio = betaPower / thetaPower;
                return Math.min(100, Math.max(0, 50 + ratio * 25));
            }

            extractMeditation(processedSignal) {
                const features = this.extractFeatures(processedSignal);
                const alphaPower = features.alpha || 0;
                return Math.min(100, Math.max(0, alphaPower * 100));
            }

            calculateMean(data) {
                let sum = 0;
                for (let i = 0; i < data.length; i++) {
                    sum += data[i];
                }
                return sum / data.length;
            }

            calculateVariance(data) {
                const mean = this.calculateMean(data);
                let sumSquaredDiff = 0;
                for (let i = 0; i < data.length; i++) {
                    const diff = data[i] - mean;
                    sumSquaredDiff += diff * diff;
                }
                return sumSquaredDiff / data.length;
            }

            calculateZeroCrossingRate(data) {
                let crossings = 0;
                for (let i = 1; i < data.length; i++) {
                    if ((data[i-1] < 0 && data[i] >= 0) || (data[i-1] >= 0 && data[i] < 0)) {
                        crossings++;
                    }
                }
                return crossings / (data.length - 1);
            }

            calculateSNR(signal) {
                const mean = this.calculateMean(signal);
                const signalPower = mean * mean;
                const noisePower = this.calculateVariance(signal);
                
                if (noisePower === 0) return 1.0;
                return Math.min(1.0, signalPower / (signalPower + noisePower));
            }
        }

        // Global instances
        let webgpuEngine = null;
        let biometricProcessor = null;
        let isProcessing = false;
        let animationId = null;

        // Initialize WebGPU Engine
        async function initWebGPU() {
            const canvas = document.getElementById('webgpu-canvas');
            const status = document.getElementById('webgpu-status');
            
            try {
                if (!window.WebGPUEngine) {
                    throw new Error('WebGPUEngine not available');
                }

                webgpuEngine = new WebGPUEngine(canvas);
                const success = await webgpuEngine.initialize();
                
                if (success) {
                    status.className = 'status success';
                    status.textContent = '✅ WebGPU engine initialized successfully';
                    return true;
                } else {
                    throw new Error('WebGPU initialization failed');
                }
            } catch (error) {
                status.className = 'status error';
                status.textContent = `❌ WebGPU initialization failed: ${error.message}`;
                return false;
            }
        }

        // Initialize Biometric Processor
        async function initBiometricProcessor() {
            const status = document.getElementById('biometric-status');
            
            try {
                biometricProcessor = new EnhancedBiometricProcessor();
                await biometricProcessor.initialize();
                
                status.className = 'status success';
                status.textContent = '✅ Biometric processor initialized successfully';
                return true;
            } catch (error) {
                status.className = 'status error';
                status.textContent = `❌ Biometric processor initialization failed: ${error.message}`;
                return false;
            }
        }

        // Simulate biometric data
        function executeEEGData(length = 512) {
            const data = new Float32Array(length);
            const time = Date.now() * 0.001;
            
            for (let i = 0; i < length; i++) {
                // Simulate EEG with multiple frequency components
                const alpha = Math.sin(i * 0.1 + time * 0.5) * 20;      // Alpha waves (8-13Hz)
                const beta = Math.sin(i * 0.2 + time * 0.8) * 15;       // Beta waves (13-30Hz)
                const theta = Math.sin(i * 0.05 + time * 0.3) * 25;     // Theta waves (4-8Hz)
                const gamma = Math.sin(i * 0.4 + time * 1.2) * 10;    // Gamma waves (30-100Hz)
                const noise = (Math.random() - 0.5) * 10;              // Random noise
                
                data[i] = alpha + beta + theta + gamma + noise;
            }
            
            return data;
        }

        // Process biometric data and update UI
        async function processBiometricData() {
            if (!biometricProcessor || !isProcessing) return;

            try {
                // Simulate EEG data
                const rawData = executeEEGData();
                
                // Process the signal
                const result = await biometricProcessor.processSignal(rawData);
                
                // Extract features
                const attention = biometricProcessor.extractAttention(result.filteredSignal);
                const meditation = biometricProcessor.extractMeditation(result.filteredSignal);
                const quality = result.quality;
                
                // Update UI
                document.getElementById('attention-value').textContent = attention.toFixed(1);
                document.getElementById('meditation-value').textContent = meditation.toFixed(1);
                document.getElementById('quality-value').textContent = (quality * 100).toFixed(1) + '%';
                
                // Update emotional state for WebGPU
                const valence = (attention - 50) / 50;      // -1 to 1
                const arousal = (meditation - 50) / 50;     // -1 to 1
                const dominance = quality;                    // 0 to 1
                
                document.getElementById('valence-value').textContent = valence.toFixed(2);
                document.getElementById('arousal-value').textContent = arousal.toFixed(2);
                document.getElementById('dominance-value').textContent = dominance.toFixed(2);
                
                // Update WebGPU visualization
                if (webgpuEngine) {
                    webgpuEngine.updateUniforms({
                        time: Date.now() * 0.001,
                        resolution: [400, 300],
                        zoom: 1 + (meditation - 50) * 0.02,
                        iterations: 50 + (quality * 150),
                        valence: valence,
                        arousal: arousal,
                        dominance: dominance
                    });
                    webgpuEngine.render();
                }
                
                // Continue processing
                if (isProcessing) {
                    animationId = requestAnimationFrame(processBiometricData);
                }
                
            } catch (error) {
                console.error('Biometric processing error:', error);
                document.getElementById('biometric-status').className = 'status error';
                document.getElementById('biometric-status').textContent = `❌ Processing error: ${error.message}`;
            }
        }

        // Event listeners
        document.getElementById('test-webgpu').addEventListener('click', async () => {
            const success = await initWebGPU();
            if (success) {
                document.getElementById('integration-status').className = 'status success';
                document.getElementById('integration-status').textContent = '✅ WebGPU engine test passed';
            }
        });

        document.getElementById('execute-biometric').addEventListener('click', async () => {
            if (!webgpuEngine) {
                alert('Please initialize WebGPU engine first');
                return;
            }
            
            // Simulate a few frames of biometric data
            for (let i = 0; i < 10; i++) {
                const valence = Math.sin(Date.now() * 0.001 + i) * 0.5;
                const arousal = Math.cos(Date.now() * 0.0008 + i) * 0.5;
                const dominance = 0.5 + Math.sin(Date.now() * 0.0012 + i) * 0.3;
                
                webgpuEngine.updateUniforms({
                    time: Date.now() * 0.001 + i * 0.1,
                    resolution: [400, 300],
                    zoom: 1,
                    iterations: 100,
                    valence: valence,
                    arousal: arousal,
                    dominance: dominance
                });
                webgpuEngine.render();
                
                await new Promise(resolve => setTimeout(resolve, 100)); // Real async processing
            }
            
            document.getElementById('integration-status').className = 'status success';
            document.getElementById('integration-status').textContent = '✅ Biometric simulation test passed';
        });

        document.getElementById('start-biometric').addEventListener('click', async () => {
            if (!biometricProcessor) {
                await initBiometricProcessor();
            }
            
            if (!webgpuEngine) {
                await initWebGPU();
            }
            
            if (biometricProcessor && webgpuEngine) {
                isProcessing = true;
                document.getElementById('start-biometric').disabled = true;
                document.getElementById('stop-biometric').disabled = false;
                
                document.getElementById('integration-status').className = 'status success';
                document.getElementById('integration-status').textContent = '✅ Real-time biometric processing active';
                
                processBiometricData();
            }
        });

        document.getElementById('stop-biometric').addEventListener('click', () => {
            isProcessing = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            
            document.getElementById('start-biometric').disabled = false;
            document.getElementById('stop-biometric').disabled = true;
            
            document.getElementById('integration-status').className = 'status warning';
            document.getElementById('integration-status').textContent = '⏸️ Biometric processing stopped';
        });

        // Initialize on page load
        window.addEventListener('load', async () => {
            console.log('🧠 Biometric Integration Test Page Loaded');
            
            // Test WebGPU support
            if (navigator.gpu) {
                console.log('✅ WebGPU supported by browser');
            } else {
                console.warn('❌ WebGPU not supported by browser');
                document.getElementById('webgpu-status').className = 'status error';
                document.getElementById('webgpu-status').textContent = '❌ WebGPU not supported by this browser';
            }
            
            // Initialize biometric processor
            await initBiometricProcessor();
        });
    </script>
</body>
</html>
