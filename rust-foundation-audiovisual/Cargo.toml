[package]
name = "rust-foundation-audiovisual"
version = "0.1.0"
edition = "2021"
description = "Simple web-based audiovisual creative system with WASM compilation"
authors = ["Compiling.org <kapil.bambardekar@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/compiling-org/rust-foundation-audiovisual"
keywords = ["webassembly", "webgpu", "audio", "creative", "wasm"]
categories = ["multimedia", "web-programming", "wasm"]

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "WebGlRenderingContext",
    "WebGl2RenderingContext",
    "AudioContext",
    "AudioBuffer",
    "OscillatorNode",
    "GainNode",
    "AudioDestinationNode",
    "MouseEvent",
    "TouchEvent",
    "TouchList",
    "Touch",
] }
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"

# Optional dependencies for native builds
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
# Optimize for size
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"