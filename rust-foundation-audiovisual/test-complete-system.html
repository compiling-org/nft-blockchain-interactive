<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust Foundation - Complete WASM System Test</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: #00ff00;
            text-align: center;
            text-shadow: 0 0 10px #00ff00;
            margin-bottom: 30px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        button {
            background: #1a1a1a;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: #00ff00;
            color: #0a0a0a;
            box-shadow: 0 0 10px #00ff00;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .status {
            background: #1a1a1a;
            border: 1px solid #00ff00;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        .status-label {
            color: #00ff00;
        }
        
        .status-value {
            color: #ffffff;
        }
        
        .error {
            background: #ff0000;
            color: #ffffff;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: none;
        }
        
        canvas {
            border: 1px solid #00ff00;
            display: block;
            margin: 20px auto;
            background: #000000;
        }
        
        .midi-devices {
            background: #1a1a1a;
            border: 1px solid #00ff00;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: none;
        }
        
        .audio-controls {
            background: #1a1a1a;
            border: 1px solid #00ff00;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        
        .slider-container {
            margin-bottom: 15px;
        }
        
        .slider-label {
            display: block;
            margin-bottom: 5px;
        }
        
        input[type="range"] {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #00ff00;
        }
        
        .parameters {
            background: #1a1a1a;
            border: 1px solid #00ff00;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        
        .parameter-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .parameter-value {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Rust Foundation - Complete WASM System Test</h1>
        
        <div id="error-container" class="error"></div>
        
        <div class="status">
            <div class="status-item">
                <span class="status-label">WASM Status:</span>
                <span id="wasm-status" class="status-value">Loading...</span>
            </div>
            <div class="status-item">
                <span class="status-label">MIDI Support:</span>
                <span id="midi-support" class="status-value">Checking...</span>
            </div>
            <div class="status-item">
                <span class="status-label">Audio Context:</span>
                <span id="audio-status" class="status-value">Not initialized</span>
            </div>
            <div class="status-item">
                <span class="status-label">WebGL Support:</span>
                <span id="webgl-status" class="status-value">Checking...</span>
            </div>
        </div>
        
        <div class="controls">
            <button id="init-wasm">Initialize WASM</button>
            <button id="init-midi">Initialize MIDI</button>
            <button id="start-audio">Start Audio</button>
            <button id="start-shader">Start Shader</button>
            <button id="stop-all">Stop All</button>
        </div>
        
        <div class="midi-devices" id="midi-devices">
            <h3>MIDI Devices</h3>
            <select id="midi-input-select">
                <option value="">Select MIDI Input...</option>
            </select>
        </div>
        
        <canvas id="shader-canvas" width="800" height="600"></canvas>
        
        <div class="audio-controls">
            <h3>Audio Controls</h3>
            <div class="slider-container">
                <label class="slider-label">Master Volume: <span id="volume-value">50</span>%</label>
                <input type="range" id="master-volume" min="0" max="100" value="50">
            </div>
            <div class="slider-container">
                <label class="slider-label">Tempo (BPM): <span id="tempo-value">120</span></label>
                <input type="range" id="tempo" min="60" max="180" value="120">
            </div>
        </div>
        
        <div class="parameters">
            <h3>Real-time Parameters</h3>
            <div class="parameter-row">
                <span class="status-label">Time:</span>
                <span id="time-param" class="parameter-value">0.00</span>
            </div>
            <div class="parameter-row">
                <span class="status-label">Mouse X:</span>
                <span id="mouse-x-param" class="parameter-value">0.00</span>
            </div>
            <div class="parameter-row">
                <span class="status-label">Mouse Y:</span>
                <span id="mouse-y-param" class="parameter-value">0.00</span>
            </div>
            <div class="parameter-row">
                <span class="status-label">Audio Level:</span>
                <span id="audio-level-param" class="parameter-value">0.00</span>
            </div>
        </div>
    </div>

    <script type="module">
        import init, { MusicEngine, ShaderRenderer, AudioAnalyzer, note_to_frequency } from './pkg/rust_foundation_audiovisual.js';
        
        let wasmInitialized = false;
        let midiAccess = null;
        let audioEngine = null;
        let shaderRenderer = null;
        let audioAnalyzer = null;
        let animationId = null;
        let audioContext = null;
        let analyserNode = null;
        let dataArray = null;
        
        // DOM elements
        const errorContainer = document.getElementById('error-container');
        const wasmStatus = document.getElementById('wasm-status');
        const midiSupport = document.getElementById('midi-support');
        const audioStatus = document.getElementById('audio-status');
        const webglStatus = document.getElementById('webgl-status');
        const canvas = document.getElementById('shader-canvas');
        const gl = canvas.getContext('webgl');
        
        // Check WebGL support
        if (gl) {
            webglStatus.textContent = 'Supported';
            webglStatus.style.color = '#00ff00';
        } else {
            webglStatus.textContent = 'Not supported';
            webglStatus.style.color = '#ff0000';
        }
        
        // Check MIDI support
        if (navigator.requestMIDIAccess) {
            midiSupport.textContent = 'Available';
            midiSupport.style.color = '#00ff00';
        } else {
            midiSupport.textContent = 'Not available';
            midiSupport.style.color = '#ff0000';
        }
        
        // Initialize WASM
        document.getElementById('init-wasm').addEventListener('click', async () => {
            try {
                wasmStatus.textContent = 'Initializing...';
                await init();
                wasmInitialized = true;
                wasmStatus.textContent = 'Ready';
                wasmStatus.style.color = '#00ff00';
                
                // Create engines
                audioEngine = MusicEngine.new();
                shaderRenderer = ShaderRenderer.new(gl);
                audioAnalyzer = AudioAnalyzer.new(2048);
                
                console.log('WASM modules initialized successfully');
            } catch (error) {
                showError('Failed to initialize WASM: ' + error.message);
                wasmStatus.textContent = 'Failed';
                wasmStatus.style.color = '#ff0000';
            }
        });
        
        // Initialize MIDI
        document.getElementById('init-midi').addEventListener('click', async () => {
            if (!wasmInitialized) {
                showError('Please initialize WASM first');
                return;
            }
            
            try {
                midiAccess = await navigator.requestMIDIAccess();
                document.getElementById('midi-devices').style.display = 'block';
                
                const select = document.getElementById('midi-input-select');
                select.innerHTML = '<option value="">Select MIDI Input...</option>';
                
                for (let input of midiAccess.inputs.values()) {
                    const option = document.createElement('option');
                    option.value = input.id;
                    option.textContent = input.name;
                    select.appendChild(option);
                }
                
                select.addEventListener('change', (e) => {
                    if (e.target.value) {
                        const input = midiAccess.inputs.get(e.target.value);
                        input.onmidimessage = handleMIDIMessage;
                    }
                });
                
            } catch (error) {
                showError('Failed to initialize MIDI: ' + error.message);
            }
        });
        
        // Handle MIDI messages
        function handleMIDIMessage(message) {
            const [command, note, velocity] = message.data;
            
            if (command === 0x90 && velocity > 0) { // Note on
                const frequency = note_to_frequency(note);
                console.log('MIDI Note:', note, 'Frequency:', frequency);
                
                // Update shader parameters
                if (shaderRenderer) {
                    shaderRenderer.set_uniform("u_midi_note", note / 127.0);
                    shaderRenderer.set_uniform("u_midi_velocity", velocity / 127.0);
                }
            }
        }
        
        // Start audio
        document.getElementById('start-audio').addEventListener('click', async () => {
            if (!wasmInitialized) {
                showError('Please initialize WASM first');
                return;
            }
            
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyserNode = audioContext.createAnalyser();
                analyserNode.fftSize = 2048;
                dataArray = new Uint8Array(analyserNode.frequencyBinCount);
                
                // Connect to destination
                analyserNode.connect(audioContext.destination);
                
                audioStatus.textContent = 'Running';
                audioStatus.style.color = '#00ff00';
                
                // Start audio analysis loop
                analyzeAudio();
                
            } catch (error) {
                showError('Failed to start audio: ' + error.message);
                audioStatus.textContent = 'Failed';
                audioStatus.style.color = '#ff0000';
            }
        });
        
        // Start shader
        document.getElementById('start-shader').addEventListener('click', () => {
            if (!wasmInitialized || !shaderRenderer) {
                showError('Please initialize WASM and start audio first');
                return;
            }
            
            // Set up basic shader
            const vertexShaderSource = `
                attribute vec2 a_position;
                void main() {
                    gl_Position = vec4(a_position, 0.0, 1.0);
                }
            `;
            
            const fragmentShaderSource = `
                precision mediump float;
                uniform float u_time;
                uniform vec2 u_resolution;
                uniform vec2 u_mouse;
                uniform float u_midi_note;
                uniform float u_midi_velocity;
                uniform float u_audio_level;
                
                void main() {
                    vec2 uv = gl_FragCoord.xy / u_resolution.xy;
                    vec2 mouse = u_mouse / u_resolution.xy;
                    
                    float wave = sin(uv.x * 10.0 + u_time * 2.0) * 0.1;
                    float midi_effect = u_midi_note * 0.5;
                    float audio_effect = u_audio_level * 0.3;
                    
                    vec3 color = vec3(
                        sin(uv.x * 3.14159 + u_time) * (0.5 + midi_effect),
                        cos(uv.y * 3.14159 + u_time * 0.7) * (0.5 + audio_effect),
                        sin((uv.x + uv.y) * 3.14159 + u_time * 1.3) * (0.5 + midi_effect * 0.5)
                    );
                    
                    gl_FragColor = vec4(color, 1.0);
                }
            `;
            
            shaderRenderer.create_shader_program("main", vertexShaderSource, fragmentShaderSource);
            shaderRenderer.use_program("main");
            
            // Start animation loop
            animate();
        });
        
        // Stop all
        document.getElementById('stop-all').addEventListener('click', () => {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            
            audioStatus.textContent = 'Stopped';
            audioStatus.style.color = '#ff0000';
        });
        
        // Audio analysis loop
        function analyzeAudio() {
            if (!analyserNode || !dataArray) return;
            
            analyserNode.getByteFrequencyData(dataArray);
            
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            const average = sum / dataArray.length;
            const normalizedLevel = average / 255.0;
            
            document.getElementById('audio-level-param').textContent = normalizedLevel.toFixed(3);
            
            // Update shader
            if (shaderRenderer) {
                shaderRenderer.set_uniform("u_audio_level", normalizedLevel);
            }
            
            requestAnimationFrame(analyzeAudio);
        }
        
        // Animation loop
        function animate() {
            if (!shaderRenderer) return;
            
            const time = performance.now() * 0.001;
            
            // Update shader uniforms
            shaderRenderer.set_uniform("u_time", time);
            shaderRenderer.set_uniform("u_resolution", [canvas.width, canvas.height]);
            
            // Update display
            document.getElementById('time-param').textContent = time.toFixed(2);
            
            // Render
            shaderRenderer.render();
            
            animationId = requestAnimationFrame(animate);
        }
        
        // Mouse tracking
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            document.getElementById('mouse-x-param').textContent = x.toFixed(0);
            document.getElementById('mouse-y-param').textContent = y.toFixed(0);
            
            if (shaderRenderer) {
                shaderRenderer.set_uniform("u_mouse", [x, y]);
            }
        });
        
        // Sliders
        document.getElementById('master-volume').addEventListener('input', (e) => {
            document.getElementById('volume-value').textContent = e.target.value;
        });
        
        document.getElementById('tempo').addEventListener('input', (e) => {
            document.getElementById('tempo-value').textContent = e.target.value;
        });
        
        // Error handling
        function showError(message) {
            errorContainer.textContent = message;
            errorContainer.style.display = 'block';
            setTimeout(() => {
                errorContainer.style.display = 'none';
            }, 5000);
        }
        
        // Initialize on page load
        window.addEventListener('load', () => {
            console.log('Page loaded, ready for WASM initialization');
        });
    </script>
</body>
</html>
