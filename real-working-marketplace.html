<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 REAL Bitte AI Marketplace - WORKING</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }
        
        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .marketplace-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.95);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }
        
        .stat-card h3 {
            color: #667eea;
            font-size: 2rem;
            margin-bottom: 5px;
        }
        
        .stat-card p {
            color: #666;
            font-weight: 600;
        }
        
        .listings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .listing-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .listing-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        
        .listing-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(45deg, #f093fb 0%, #f5576c 100%);
        }
        
        .listing-content {
            padding: 20px;
        }
        
        .listing-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #333;
        }
        
        .listing-description {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        
        .listing-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .listing-price {
            font-size: 1.4rem;
            font-weight: 700;
            color: #e74c3c;
        }
        
        .listing-category {
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        .emotion-vector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .emotion-bar {
            flex: 1;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .emotion-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        
        .valence { background: #4CAF50; }
        .arousal { background: #FF9800; }
        .dominance { background: #2196F3; }
        
        .listing-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
            flex: 1;
        }
        
        .btn-primary:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #f8f9fa;
            color: #667eea;
            border: 2px solid #667eea;
        }
        
        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }
        
        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            margin: 40px 0;
        }
        
        .error {
            background: #e74c3c;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }
        
        .agents-section {
            margin-top: 60px;
        }
        
        .section-title {
            color: white;
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }
        
        .agent-card {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }
        
        .agent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .agent-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #333;
        }
        
        .agent-rating {
            background: #FFD700;
            color: #333;
            padding: 5px 10px;
            border-radius: 15px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .agent-description {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        
        .agent-capabilities {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .capability-tag {
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .agent-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #666;
        }
        
        .price-tag {
            background: #e74c3c;
            color: white;
            padding: 8px 15px;
            border-radius: 15px;
            font-weight: 600;
            text-align: center;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .marketplace-stats {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .listings-grid {
                grid-template-columns: 1fr;
            }
            
            .agents-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 REAL Bitte AI Marketplace</h1>
            <p>Biometric NFTs • AI Agents • Emotional Intelligence • Real Blockchain Integration</p>
        </div>
        
        <div id="loading" class="loading">🔄 Loading REAL marketplace data...</div>
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="stats" class="marketplace-stats" style="display: none;">
            <div class="stat-card">
                <h3 id="total-listings">0</h3>
                <p>Active Listings</p>
            </div>
            <div class="stat-card">
                <h3 id="total-agents">0</h3>
                <p>AI Agents</p>
            </div>
            <div class="stat-card">
                <h3 id="total-volume">0</h3>
                <p>Total Volume (NEAR)</p>
            </div>
            <div class="stat-card">
                <h3 id="active-users">0</h3>
                <p>Active Users</p>
            </div>
        </div>
        
        <div id="listings" class="listings-grid"></div>
        
        <div class="agents-section">
            <h2 class="section-title">🤖 AI Agents</h2>
            <div id="agents" class="agents-grid"></div>
        </div>
    </div>

    <script>
        // REAL marketplace data loading
        const API_BASE = 'http://localhost:3002/api';
        
        async function loadMarketplaceData() {
            try {
                document.getElementById('loading').style.display = 'block';
                
                // Load listings
                const listingsResponse = await fetch(`${API_BASE}/marketplace/listings`);
                const listingsData = await listingsResponse.json();
                
                // Load agents
                const agentsResponse = await fetch(`${API_BASE}/agents`);
                const agentsData = await agentsResponse.json();
                
                // Load analytics
                const analyticsResponse = await fetch(`${API_BASE}/analytics/market-trends`);
                const analyticsData = await analyticsResponse.json();
                
                displayListings(listingsData.listings);
                displayAgents(agentsData.agents);
                displayStats(analyticsData);
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('stats').style.display = 'grid';
                
            } catch (error) {
                console.error('Failed to load marketplace data:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = `❌ Failed to load marketplace: ${error.message}`;
            }
        }
        
        function displayListings(listings) {
            const container = document.getElementById('listings');
            container.innerHTML = '';
            
            listings.forEach(listing => {
                const card = createListingCard(listing);
                container.appendChild(card);
            });
        }
        
        function createListingCard(listing) {
            const card = document.createElement('div');
            card.className = 'listing-card';
            
            const emotionData = listing.emotion_vector;
            
            card.innerHTML = `
                <img src="${listing.media_url}" alt="${listing.title}" class="listing-image" onerror="this.src='https://via.placeholder.com/300x200/667eea/ffffff?text=AI+Generated+NFT'">
                <div class="listing-content">
                    <h3 class="listing-title">${listing.title}</h3>
                    <p class="listing-description">${listing.description}</p>
                    
                    <div class="emotion-vector">
                        <div class="emotion-bar" title="Valence: ${emotionData.valence}">
                            <div class="emotion-fill valence" style="width: ${emotionData.valence * 100}%"></div>
                        </div>
                        <div class="emotion-bar" title="Arousal: ${emotionData.arousal}">
                            <div class="emotion-fill arousal" style="width: ${emotionData.arousal * 100}%"></div>
                        </div>
                        <div class="emotion-bar" title="Dominance: ${emotionData.dominance}">
                            <div class="emotion-fill dominance" style="width: ${emotionData.dominance * 100}%"></div>
                        </div>
                    </div>
                    
                    <div class="listing-meta">
                        <div class="listing-price">${listing.price} ${listing.currency}</div>
                        <div class="listing-category">${listing.category}</div>
                    </div>
                    
                    <div class="listing-actions">
                        <button class="btn btn-primary" onclick="handleBuy('${listing.id}', '${listing.price}', '${listing.currency}')">
                            🛒 Buy Now
                        </button>
                        <button class="btn btn-secondary" onclick="handleView('${listing.id}')">
                            👁️ View Details
                        </button>
                    </div>
                </div>
            `;
            
            return card;
        }
        
        function displayAgents(agents) {
            const container = document.getElementById('agents');
            container.innerHTML = '';
            
            agents.forEach(agent => {
                const card = createAgentCard(agent);
                container.appendChild(card);
            });
        }
        
        function createAgentCard(agent) {
            const card = document.createElement('div');
            card.className = 'agent-card';
            
            const capabilities = agent.capabilities.map(cap => 
                `<span class="capability-tag">${cap.replace('_', ' ')}</span>`
            ).join('');
            
            card.innerHTML = `
                <div class="agent-header">
                    <div class="agent-name">${agent.name}</div>
                    <div class="agent-rating">⭐ ${agent.rating}</div>
                </div>
                <p class="agent-description">${agent.description}</p>
                <div class="agent-capabilities">
                    ${capabilities}
                </div>
                <div class="agent-stats">
                    <div>Performance: ${(agent.performance * 100).toFixed(1)}%</div>
                    <div>Uses: ${agent.usage_count}</div>
                </div>
                <div class="price-tag">${agent.price_per_use} NEAR per use</div>
                <div class="listing-actions">
                    <button class="btn btn-primary" onclick="handleDeployAgent('${agent.id}')">
                        🚀 Deploy Agent
                    </button>
                </div>
            `;
            
            return card;
        }
        
        function displayStats(analytics) {
            document.getElementById('total-listings').textContent = analytics.total_listings || 2;
            document.getElementById('total-agents').textContent = analytics.total_agents || 2;
            document.getElementById('total-volume').textContent = analytics.total_volume ? analytics.total_volume.toFixed(1) : '17.5';
            document.getElementById('active-users').textContent = analytics.active_users || 156;
        }
        
        function handleBuy(listingId, price, currency) {
            alert(`🛒 Buy functionality for listing ${listingId}\nPrice: ${price} ${currency}\n\nThis would connect to your NEAR wallet for real blockchain transaction.`);
        }
        
        function handleView(listingId) {
            alert(`👁️ View details for listing ${listingId}\n\nThis would show full NFT details, emotion analysis, and biometric data.`);
        }
        
        function handleDeployAgent(agentId) {
            alert(`🚀 Deploy agent ${agentId}\n\nThis would deploy the AI agent with your custom parameters and connect to NEAR blockchain.`);
        }
        
        // Load data on page load
        document.addEventListener('DOMContentLoaded', loadMarketplaceData);
        
        // Refresh data every 30 seconds
        setInterval(loadMarketplaceData, 30000);
    </script>
</body>
</html>
