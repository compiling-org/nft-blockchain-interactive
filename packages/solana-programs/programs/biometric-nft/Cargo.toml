[package]
name = "biometric-nft"
version = "0.1.0"
description = "Biometric NFT program with emotional metadata"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "biometric_nft"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
solana-program = "1.18.0"
