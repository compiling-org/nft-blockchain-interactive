[package]
name = "biometric-soulbound-nft"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
near-sdk = { version = "5.1.0", features = ["legacy", "unit-testing"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
borsh = { version = "1.0", features = ["derive"] }
near-contract-standards = "5.1.0"
# schemars = { version = "0.8.16", features = ["derive"] } # Removed to fix build

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
