[package]
name = "polkadot-client"
version = "0.1.0"
edition = "2021"
description = "Polkadot client for creative NFT metadata and cross-chain bridging"
authors = ["Dr. Kapil Bambardekar <kapil.bambardekar@gmail.com>", "Grigori Korotkikh <vdmo@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/compiling-org/nft-blockchain-interactive"
homepage = "https://compiling-org.netlify.app"

[workspace]

[dependencies]
subxt = "0.44.0"
subxt-signer = "0.44.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
sp-core = { version = "31.0.0", features = ["std"] }
sp-runtime = { version = "34.0.0", features = ["std"] }
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
parity-scale-codec = "3.6.12"
scale-info = { version = "2.11.1", features = ["derive"] }
# curve25519-dalek = "3.2.1" # Removed to avoid conflict with subxt
